version: 1

# Minimal "skills" manifest scaffold.
# Treat each skill as a module with an explicit risk level and required approvals.

skills:
  - id: repo_report
    description: Generate daily repo status report (internal)
    risk: low
    requires:
      - github_read
    safe_mode_supported: true

  - id: external_posting
    description: Generate (proposal-only) social posts; never auto-publish by default
    risk: high
    requires:
      - manual_approval
      - allowlisted_egress
    safe_mode_supported: true

  - id: task_routing
    description: Route tasks to optimal entities based on domain affinity
    risk: low
    requires:
      - internal_routing
    safe_mode_supported: true

  - id: agent_bootstrap
    description: Bootstrap supervised agents with least-privilege capabilities; privileged actions require explicit review
    risk: high
    requires:
      - internal_spawn
      - manual_approval
      - least_privilege_templates
    safe_mode_supported: true

  - id: parallel_build
    description: Run allowlisted build/test tasks only; disabled by default and restricted to an isolated build runner
    risk: high
    requires:
      - build_exec
      - isolated_build_runner
      - manual_approval
    safe_mode_supported: true

  - id: limit_bypass
    description: Optional bounded limit increases only; disabled by default and unlimited mode is prohibited
    risk: high
    requires:
      - explicit_limit_allowlist
      - manual_approval
      - LIMIT_BYPASS_ENABLED
    safe_mode_supported: true
