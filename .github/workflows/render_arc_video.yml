name: Render Arc Video
on:
  push:
    paths:
      - 'spine/*.py'
      - 'hyperloop_state.json'
  workflow_dispatch:
    inputs:
      spf:
        description: 'Frames per round (lower=faster)'
        default: '3'
      hold:
        description: 'Hold seconds at end'
        default: '4.0'

permissions:
  contents: read

jobs:
  render:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get install -y ffmpeg
          pip install matplotlib numpy requests pillow

      - name: Render cinematic arc
        run: |
          python scripts/gen_cinematic.py \
            --output /tmp/evez_arc.mp4 \
            --fps 30 \
            --spf ${{ github.event.inputs.spf || '3' }} \
            --hold ${{ github.event.inputs.hold || '4.0' }}
          ls -lh /tmp/evez_arc.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evez-arc-r${{ github.run_number }}
          path: /tmp/evez_arc.mp4
          retention-days: 5
