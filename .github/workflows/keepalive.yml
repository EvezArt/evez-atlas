name: Workflow Health Inventory

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Report disabled workflows without re-enabling them
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const disabled = response.data.workflows
              .filter(workflow => workflow.state !== "active")
              .map(workflow => ({ id: workflow.id, name: workflow.name, state: workflow.state }));
            core.info("Workflow inventory: " + response.data.total_count + " total.");
            if (disabled.length) {
              core.warning("Disabled workflows remain disabled by design: " + JSON.stringify(disabled));
            } else {
              core.info("No disabled workflows found.");
            }
