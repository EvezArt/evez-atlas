name: FIRE Cascade Receiver
on:
  repository_dispatch:
    types: [fire_cascade]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: atlas-state-writer
  cancel-in-progress: false

jobs:
  fire-received:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Log FIRE event
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          echo "FIRE CASCADE RECEIVED at Atlas v3"
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          path = os.environ.get("GITHUB_EVENT_PATH", "")
          event = json.loads(Path(path).read_text()) if path else {}
          payload = event.get("client_payload") or {}
          source = payload.get("source", "manual")
          if not isinstance(source, str):
              source = "invalid-source-type"
          record = {"ts": datetime.datetime.now(datetime.timezone.utc).isoformat(), "event": "fire_cascade", "source": source[:120]}
          target = Path("data/fire/events.jsonl")
          target.parent.mkdir(parents=True, exist_ok=True)
          with target.open("a", encoding="utf-8") as stream:
              stream.write(json.dumps(record, ensure_ascii=False) + "\n")
          PY
      - name: Run A012 Engine
        continue-on-error: true
        run: |
          if [ -f skills/a012_telemetry_coincidence_engine.py ]; then
            python skills/a012_telemetry_coincidence_engine.py --state data/hyperloop_state.json --mode full --output data/a012/predictions.jsonl 2>&1 || true
          else
            echo "A012 engine not found, skipping"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit results
        run: |
          git config user.name "EVEZ-OS Atlas"
          git config user.email "atlas@evez666.local"
          git add -A
          git diff --staged --quiet || git commit -m "fire-cascade: Atlas v3 cycle $(date -u +%FT%TZ)"
          git push
