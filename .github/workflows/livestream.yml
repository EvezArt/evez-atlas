name: EVEZ Intel Livestream → YouTube

on:
  workflow_dispatch:
    inputs:
      confirm_live_stream:
        description: 'Explicitly confirm publishing a live stream to YouTube'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stream:
    if: inputs.confirm_live_stream == true
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core python3-pip --no-install-recommends
          pip3 install pillow --quiet

      - name: Run livestream
        timeout-minutes: 355
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          AI_ML_API_KEY: ${{ secrets.AI_ML_API_KEY }}
          RTMP_URL: rtmp://a.rtmp.youtube.com/live2
        run: |
          python3 scripts/livestream_intel.py
